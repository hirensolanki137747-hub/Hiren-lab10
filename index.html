<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TheMetal - Products</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-black min-h-screen">

    <!-- Header -->
    <header class="bg-gray-900 text-white px-8 py-5 shadow-lg">
        <h1 class="text-3xl font-bold">
            The<span class="text-red-500">Metal</span>
        </h1>
    </header>

    <!-- Products Section -->
    <main class="p-8">

        <h2 class="text-3xl font-bold text-center text-white mb-2">
            Our Products
        </h2>

        <p class="text-center text-gray-400 mb-8">
            Discover quality products at great prices.
        </p>

        <div class="flex flex-wrap justify-center gap-8">

            <!-- Laptop -->
            <div class="bg-gray-900 p-4 w-60 rounded-xl shadow-md border border-gray-800">
                <img
                    src="https://images.unsplash.com/photo-1517336714731-489689fd1ca8?w=400&h=300&fit=crop"
                    alt="Laptop"
                    class="w-full h-40 object-cover rounded-lg mb-4">

                <h3 class="text-xl font-bold text-white">Laptop</h3>
                <p class="text-gray-400 mt-2">Price: ₹45,999</p>

                <button class="bg-red-600 text-white font-semibold px-4 py-2 mt-4 w-full rounded-lg hover:bg-red-700">
                    Buy Now
                </button>
            </div>

            <!-- Mobile -->
            <div class="bg-gray-900 p-4 w-60 rounded-xl shadow-md border border-gray-800">
                <img
                    src="https://images.unsplash.com/photo-1511707171634-5f897ff02aa9?w=400&h=300&fit=crop"
                    alt="Mobile Phone"
                    class="w-full h-40 object-cover rounded-lg mb-4">

                <h3 class="text-xl font-bold text-white">Mobile</h3>
                <p class="text-gray-400 mt-2">Price: ₹19,999</p>

                <button class="bg-red-600 text-white font-semibold px-4 py-2 mt-4 w-full rounded-lg hover:bg-red-700">
                    Buy Now
                </button>
            </div>

            <!-- Shoes -->
            <div class="bg-gray-900 p-4 w-60 rounded-xl shadow-md border border-gray-800">
                <img
                    src="https://images.unsplash.com/photo-1495555961986-6d4c1ecb7be3?w=400&h=300&fit=crop"
                    alt="Sports Shoes"
                    class="w-full h-40 object-cover rounded-lg mb-4">

                <h3 class="text-xl font-bold text-white">Shoes</h3>
                <p class="text-gray-400 mt-2">Price: ₹2,499</p>

                <button class="bg-red-600 text-white font-semibold px-4 py-2 mt-4 w-full rounded-lg hover:bg-red-700">
                    Buy Now
                </button>
            </div>

            <!-- Watch -->
            <div class="bg-gray-900 p-4 w-60 rounded-xl shadow-md border border-gray-800">
                <img
                    src="https://images.unsplash.com/photo-1524805444758-089113d48a6d?w=400&h=300&fit=crop"
                    alt="Wrist Watch"
                    class="w-full h-40 object-cover rounded-lg mb-4">

                <h3 class="text-xl font-bold text-white">Watch</h3>
                <p class="text-gray-400 mt-2">Price: ₹3,499</p>

                <button class="bg-red-600 text-white font-semibold px-4 py-2 mt-4 w-full rounded-lg hover:bg-red-700">
                    Buy Now
                </button>
            </div>

        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-gray-900 text-gray-400 text-center p-5 mt-8">
        <p class="text-lg font-semibold text-white">
            © 2026 <span class="text-red-500">TheMetal</span>
        </p>
        <p class="text-sm mt-1">
            Quality Products. Great Prices.
        </p>
    </footer>

</body>
</html>
